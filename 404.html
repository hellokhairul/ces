<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - পেজ পাওয়া যায়নি | Compact Engineering</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            background: #fff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h1 {
            font-size: 5rem;
            color: #0d6efd;
            margin-bottom: 10px;
            line-height: 1;
        }
        h2 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #212529;
        }
        p {
            color: #6c757d;
            margin-bottom: 25px;
            font-size: 1rem;
        }
        .home-btn {
            display: inline-block;
            background-color: #0d6efd;
            color: #ffffff;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: background 0.2s ease;
        }
        .home-btn:hover {
            background-color: #0b5ed7;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>404</h1>
        <h2>পেজটি পাওয়া যায়নি!</h2>
        <p>আপনি যে লিঙ্কটিতে প্রবেশ করার চেষ্টা করছেন তা হয়তো মুছে ফেলা হয়েছে অথবা ভুল টাইপ করা হয়েছে।</p>
        <a href="/" class="home-btn">হোম পেজে ফিরে যান</a>
    </div>

</body>
</html>
